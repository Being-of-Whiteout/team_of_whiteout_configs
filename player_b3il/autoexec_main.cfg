# =============================== KEYBOARD&MOUSE ==============================
#             All binds are default except: jump; team/chat message           
#                           Useless bind were deleted

unbindall


# ANALOG BINDS
bind "X_AXIS" ""
bind "Y_AXIS" ""
bind "MOUSE_X" "yaw"
bind "MOUSE_Y" "pitch"
bind "U_AXIS" ""
bind "R_AXIS" ""


# KEYBOARD & MOUSE SETTINGS
mouse_inverty "false"                                                          //Reverse mouse
option_duck_method "false"                                                     //Duck method as Toggle       
option_speed_method "false"                                                    //Walk method as Toggle
cl_debounce_zoom "true"                                                        //Zoom button hold
sensitivity "1.250000"                                                         //Mouse sensitivity
m_yaw "0.016500"                                                               //Horizontal sensitivity multiplier
m_pitch "0.022000"                                                             //Vertical sensetivity multiplier
zoom_sensitivity_ratio "1.430000"                                              //Zoom sensitivity multiplier	


# MOVEMENT KEYS
bind "" "show_loadout_toggle"                                                  //Toggle inventory display
bind "W" "+forward"                                                            //Move forward
bind "S" "+back"                                                               //Move backward
bind "A" "+left"                                                               //Move left (strafe)
bind "D" "+right"                                                              //Move right (strafe)
bind "SHIFT" "+sprint"                                                         //Walk
bind "CTRL" "+duck"                                                            //Duck
bind "SPACE" "+jump"                                                           //Jump (use SPACE)


# WEAPON KEYS
bind "E" "+use"                                                                //Use
bind "MOUSE1" "+attack"                                                        //Fire
bind "MOUSE2" "+attack2"                                                       //Secondary fire
bind "R" "+reload"                                                             //Reload
bind "" "+quickinv"                                                            //Radial weapon menu
bind "MWHEELUP" "armprev"                                                      //Select previous weapon (use MWHEELUP/MWHEElDOWN)
bind "MWHEELDOWN" "armnext"                                                    //Select next weapon (use MWHEELUP/MWHEElDOWN)
bind "Q" "armlast"                                                             //Last weapon used (add "+" in fron of command for fast AWP switch)
bind "G" "armdrop"                                                             //Drop weapon
bind "N" "+bombdrop"                                                           //Drop bomb
bind "F" "+lookatweapon"                                                       //Inspect weapon
bind "" "switchhands"                                                          //Switch viemodel L/R hand
bind "B" "+buymenu"                                                            //Buymenu (add "+" not to toggle buymenu)
bind "1" "primary"                                                             //Primary weapon
bind "2" "secondary"                                                           //Secondary weapon
bind "3" "+knife"                                                              //Melee weapon
bind "5" "bomb"                                                                //Explosives & traps
bind "Z" "+he"                                                                 //HE grenade
bind "X" "+flash"                                                              //Flashbang
bind "C" "+smoke"                                                              //Smoke grenade
bind "4" "+decoy"                                                              //Decoy grenade
bind "V" "+molly"                                                              //Molotov cocktail or Incendiary grenades
bind "" "zeus"                                                                 //Zeus x27
bind "T" "+spray_menu"                                                         //Graffiti menu


# UI KEYS
bind "TAB" "+showscores"                                                       //Scoreboard
bind "" "+cl_show_team_equipment"                                              //Show team equipment
bind "" "toggleradarscale"                                                     //Toggle radar zoom
bind "" "teammenu"                                                             //Choose team
bind "6" "toggleconsole"                                                       //Toggle console
bind "HOME" "disconnect; exec autoexec_main"                                   //Disconnect from a server (this key resets all practice bind to competitive ones)
bind "END" "quit"                                                              //Quit the game


# COMMUNICATION OPTIONS
bind "MOUSE3" "player_ping"                                                    //Player ping
bind "" "radio"                                                                //Radio message
bind "" "radio1"                                                               //Command radio message
bind "" "radio2"                                                               //Standart radio message
bind "" "radio3"                                                               //Report radio message
bind "" "messagemode2"                                                         //Team message
bind "" "+chat"                                                                //Chat message (Right SHIFT + ENTER, does not work in match end menu)
bind "MOUSE4" "+voicerecord"                                                   //Use microphone
bind "" "voice_toggle_open_mic"                                                //TOggle between Open-Mic and Push-to-Talk
bind "" "clutch_mode_toggle"                                                   //Temporarily disable incoming chat
bind "" "callvote starttimeout"                                                //Call timeout


# CHAT WHEEL KEYS
bind "" "+radialradio"                                                         //Chat wheel 1
bind "" "+radialradio1"                                                        //Chat wheel 2
bind "" "+radialradio2"                                                        //Chat wheel 3


# CONFIGS






# ==================================== LOGIC ==================================

alias "armprev" "invprev"
alias "armnext" "invnext"
alias "armlast" "lastinv"

alias "armdrop" "drop; viewmodel_presetpos_default"

alias "+bombdrop" "slot5; viewmodel_presetpos_default"
alias "-bombdrop" "drop"

alias "primary" "slot1; viewmodel_presetpos_default"
alias "Secondary" "slot2; viewmodel_presetpos_default"

alias "+knife" "+lookatweapon; slot3; viewmodel_presetpos_default"
alias "-knife" "-lookatweapon"

alias "bomb" "slot5; viewmodel_presetpos_default"
alias "zeus" "slot11; viewmodel_presetpos_default"

alias "+he" "open_buymenu; pickup_groundweapon 44; close_buymenu; buy hegrenade; slot6"
alias "-he" "slot6; viewmodel_presetpos_nade" 
   
alias "+flash" "open_buymenu; pickup_groundweapon 43; close_buymenu; buy flashbang; slot7" 
alias "-flash" "slot7; viewmodel_presetpos_nade"

alias "+smoke" "open_buymenu; pickup_groundweapon 45; close_buymenu; buy smokegrenade; slot8"
alias "-smoke" "slot8; viewmodel_presetpos_nade" 

alias "+decoy" "open_buymenu; pickup_groundweapon 47; close_buymenu; buy decoy; slot10" 
alias "-decoy" "slot9; viewmodel_presetpos_nade"
   
alias "+molly" "open_buymenu; pickup_groundweapon 46; pickup_groundweapon 48; close_buymenu; buy molotov; buy incgrenade; slot10" 
alias "-molly" "slot10; viewmodel_presetpos_nade"

alias "viewmodel_presetpos_nade" "viewmodel_offset_X 2.500000; viewmodel_offset_Y 0.000000; viewmodel_offset_Z -1.500000; viewmodel_fov 68"
alias "viewmodel_presetpos_default" "viewmodel_offset_X 0.000000; viewmodel_offset_Y -2.000000; viewmodel_offset_Z -2.000000; viewmodel_fov 60"


alias "+armlast" "slot3"
alias "-armlast" "slot1"


alias "+buymenu" "buymenu"
alias "-buymenu" "buymenu"


alias "+chat" "bind SCANCODE40 messagemode"
alias "-chat" "bind SCANCODE40 messagemode2"





